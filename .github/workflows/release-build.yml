# SPDX-License-Identifier: BUSL-1.1

# The release build, as a REUSABLE workflow — the SLSA Build Level 3 lane
# (SLSA v1.2, the current spec).
#
# WHY THIS IS A SEPARATE FILE, which is the whole point of it. SLSA Build L3
# requires that the secret material used to authenticate the provenance "MUST
# NOT be accessible to the environment running the user-defined build steps"
# (https://slsa.dev/spec/v1.2/build-requirements §Provenance is Unforgeable).
# `actions/attest` inside an ordinary job does not satisfy that: every step of a
# job shares one runner VM, so a build step could in principle reach the signing
# material. That single clause is the only thing separating Build L2 from L3.
#
# GitHub's documented remedy is to move the build AND its attestation into a
# reusable workflow, which runs on its own VM and whose steps a caller cannot
# add to — a caller passes declared inputs and nothing else
# (https://docs.github.com/actions/security-guides/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3).
# The build definition therefore stops being caller-defined, and the Fulcio
# certificate names THIS workflow as the signer, which a consumer can require:
#
#   gh attestation verify ferroterm-<tag>-<target>.tar.gz \
#     -R rubentalstra/FerroTERM \
#     --signer-workflow rubentalstra/FerroTERM/.github/workflows/release-build.yml
#
# That flag is the consumer-visible prize: it lets a downstream verifier insist
# an artifact came from this hardened lane rather than from any workflow that
# happens to live in this repository.
name: Release build (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag being built.
        required: true
        type: string
      sha:
        description: The commit the release was cut from.
        required: true
        type: string
      target:
        description: The Rust target triple.
        required: true
        type: string
      runner:
        description: The runner label matching the target's architecture.
        required: true
        type: string

permissions: {}

# The server feature that embeds app/ferroterm-viewer/dist into the binary. It
# is off by default so an ordinary `cargo build` never needs a bundle, and on
# here so a release carries the viewer (docs/viewer.md §2). This is CI's only
# reference to the name: rename the feature in app/ferroterm-server/Cargo.toml
# and here, and nowhere else.
env:
  VIEWER_FEATURE: ui

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    # A deliberately cold release build (no cache) of the full workspace.
    timeout-minutes: 60
    permissions:
      contents: write # attach the per-arch tarballs to the release
      id-token: write # Sigstore, for the provenance + SBOM attestations
      attestations: write # store them against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
      # Cold by construction, not by hope: setup-rust-toolchain restores a
      # rust-cache entry unless told otherwise, so the published tarballs would
      # be linked from cached bytes this job did not build. A publishing lane
      # restores no cache — nothing a prior run could have poisoned may
      # influence the artifact it signs.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          target: ${{ inputs.target }}

      # musl needs its C toolchain; every other target builds natively on its
      # matching runner (no cross toolchain, no QEMU).
      - name: Install musl tooling
        if: ${{ contains(inputs.target, 'musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The viewer bundle is architecture-independent, and it is built HERE
      # rather than handed to this lane by its caller. A bundle produced in an
      # ordinary caller job would put bytes this lane did not build inside the
      # binary it signs, and that isolation is exactly what SLSA Build L3 buys
      # (https://slsa.dev/spec/v1.2/build-requirements). Building it once per
      # architecture costs a few minutes and adds no attestation subject: the
      # bundle rides inside the binary the existing lane already signs.
      - name: Install Trunk
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: trunk@0.21.14
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Build the viewer bundle
        working-directory: app/ferroterm-viewer
        run: trunk build --release --locked

      # `cargo auditable` embeds the compressed dependency list in the binary's
      # own `.dep-v0` section (<4 KiB), so the SHIPPED artifact self-describes to
      # syft/trivy/grype/osv-scanner even when the release page's SBOM never
      # travelled with it (https://github.com/rust-secure-code/cargo-auditable).
      - name: Install cargo-auditable
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-auditable@0.7.5

      - name: Build the server and the build tool
        # `ferroterm-server` produces the `ferroterm` binary; `ferroterm-build`
        # produces the offline index builder shipped beside it. Adjust here and
        # in the Package/SBOM steps if a crate or bin is renamed. Two
        # invocations, because a plain feature name needs a single selected
        # package (https://doc.rust-lang.org/cargo/reference/features.html).
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # Naming the bundle directory is what makes a missing bundle fail the
          # build: the server's build script refuses when the variable names a
          # directory that does not read, and only warns when it falls back to
          # the default. Without it a release would ship a viewer-less binary
          # and nothing would say so.
          FERROTERM_UI_BUNDLE="${GITHUB_WORKSPACE}/app/ferroterm-viewer/dist" \
            cargo auditable build --release --locked --target "$TARGET" \
            -p ferroterm-server --features "$VIEWER_FEATURE"
          cargo auditable build --release --locked --target "$TARGET" \
            -p ferroterm-build

      - name: Package
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          out="ferroterm-${TAG}-${TARGET}.tar.gz"
          bindir="target/${TARGET}/release"
          strip "${bindir}/ferroterm" "${bindir}/ferroterm-build"
          tar -C "$bindir" -czf "$out" ferroterm ferroterm-build
          echo "ASSET=$out" >> "$GITHUB_ENV"
          # A plain checksum beside the tarball — the only verification available
          # to an operator with neither `gh` nor a network path to Sigstore
          # (`sha256sum -c <file>.sha256sum`). It is NOT a signature and detects
          # only a corrupt or truncated download; only the Sigstore bundle
          # answers "who built this". Records the BARE filename so `-c` works in
          # whatever directory the two files landed in.
          sha256sum "$out" > "${out}.sha256sum"
          cat "${out}.sha256sum"
          echo "CHECKSUM=${out}.sha256sum" >> "$GITHUB_ENV"

      # A CycloneDX SBOM of the Rust dependency graph — a different document from
      # any container SBOM, with the DIRECT vs TRANSITIVE edges that make an SBOM
      # actionable. Generated from the release commit's own Cargo.lock with
      # `--locked`, so it describes the graph that was actually built.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-cyclonedx
      - name: Generate the dependency SBOM
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # Scoped to the binary-producing crate, so the document describes the
          # released artifact rather than the whole workspace. `--spec-version
          # 1.5` is the HIGHEST cargo-cyclonedx emits (its default is 1.3);
          # dropping the flag would silently downgrade every release.
          cargo cyclonedx \
            --manifest-path app/ferroterm-server/Cargo.toml \
            --features "$VIEWER_FEATURE" \
            --format json --describe binaries --spec-version 1.5
          sbom="ferroterm-${TAG}-${TARGET}.cdx.json"
          # cargo-cyclonedx names the file after the binary; find it rather than
          # hard-coding the exact stem, then rename it after the asset it
          # describes.
          src="$(find app/ferroterm-server -maxdepth 1 -name '*.cdx.json' | head -n1)"
          [ -n "$src" ] || { echo "::error::cargo-cyclonedx produced no .cdx.json"; exit 1; }
          mv "$src" "$sbom"
          echo "SBOM=$sbom" >> "$GITHUB_ENV"
          # The build tool rides in the same tarball and gets its own document.
          cargo cyclonedx \
            --manifest-path tools/ferroterm-build/Cargo.toml \
            --format json --describe binaries --spec-version 1.5
          build_sbom="ferroterm-build-${TAG}-${TARGET}.cdx.json"
          src="$(find tools/ferroterm-build -maxdepth 1 -name '*.cdx.json' | head -n1)"
          [ -n "$src" ] || { echo "::error::cargo-cyclonedx produced no .cdx.json for ferroterm-build"; exit 1; }
          mv "$src" "$build_sbom"
          echo "BUILD_SBOM=$build_sbom" >> "$GITHUB_ENV"

      # `actions/attest` is the one attestation action: no sbom/predicate input
      # = provenance mode; `sbom-path` = SBOM mode.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Attest the SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.SBOM }}
      - name: Attest the build tool SBOM
        id: build-sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.BUILD_SBOM }}

      # The attestations live in GitHub's attestations API (what `gh attestation
      # verify` reads without a --bundle flag). Publishing them as assets adds
      # OFFLINE verification and visibility to scanners that read a release's
      # file list — the OpenSSF Scorecard signed-releases probes match filename
      # suffixes (`.sigstore.json` for a signature, `.intoto.jsonl` for
      # provenance). The `.intoto.jsonl` is a re-container of the bundle's
      # already-DSSE-wrapped in-toto Statement, one envelope per line.
      - name: Publish the attestations as release assets
        env:
          ASSET_NAME: ${{ env.ASSET }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
          BUILD_SBOM_BUNDLE: ${{ steps.build-sbom-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "${ASSET_NAME}.sigstore.json"
          cp "$SBOM_BUNDLE" "${ASSET_NAME}.sbom.sigstore.json"
          cp "$BUILD_SBOM_BUNDLE" "${ASSET_NAME}.build-sbom.sigstore.json"
          jq -c '.dsseEnvelope' "$PROVENANCE_BUNDLE" > "${ASSET_NAME}.intoto.jsonl"
          # Refuse to publish an empty or malformed provenance line rather than
          # attaching a file that looks like provenance and is not.
          payload_type="$(jq -r '.payloadType' "${ASSET_NAME}.intoto.jsonl")"
          [ "$payload_type" = "application/vnd.in-toto+json" ] || {
            echo "::error::provenance envelope is not in-toto (payloadType=${payload_type})"
            exit 1
          }
          predicate="$(jq -r '.payload' "${ASSET_NAME}.intoto.jsonl" | base64 -d | jq -r '.predicateType')"
          [ "$predicate" = "https://slsa.dev/provenance/v1" ] || {
            echo "::error::provenance predicate is not SLSA v1 (${predicate})"
            exit 1
          }
          {
            echo "PROVENANCE_BUNDLE_ASSET=${ASSET_NAME}.sigstore.json"
            echo "SBOM_BUNDLE_ASSET=${ASSET_NAME}.sbom.sigstore.json"
            echo "BUILD_SBOM_BUNDLE_ASSET=${ASSET_NAME}.build-sbom.sigstore.json"
            echo "PROVENANCE_JSONL_ASSET=${ASSET_NAME}.intoto.jsonl"
          } >> "$GITHUB_ENV"

      # The image lane (release-image.yml) takes the tarball from this run's
      # artifacts and re-verifies its attestation before copying the binary.
      - name: Hand the tarball to the image lane
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferroterm-${{ inputs.tag }}-${{ inputs.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The release is still a DRAFT here and must stay one: the caller's
          # finalize job publishes it once every arch has attached its assets.
          # Release immutability freezes a PUBLISHED release, so flipping it here
          # would lock the other architectures out.
          draft: true
          tag_name: ${{ inputs.tag }}
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
            ${{ env.SBOM }}
            ${{ env.BUILD_SBOM }}
            ${{ env.PROVENANCE_BUNDLE_ASSET }}
            ${{ env.SBOM_BUNDLE_ASSET }}
            ${{ env.BUILD_SBOM_BUNDLE_ASSET }}
            ${{ env.PROVENANCE_JSONL_ASSET }}
