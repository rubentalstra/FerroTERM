# release.yml — THE release pipeline.
#
# ONE workflow owns the `v*` tag, and every ordering in it is a `needs` edge.
# The graph:
#
#   plan ── github-release (draft) ── build-binaries ── finalize-release (publish)
#
# The release is created as a DRAFT, the per-arch binaries + SBOMs + Sigstore
# bundles are attached by the reusable build lane, and only then — once every
# expected asset is present — is the release PUBLISHED, which freezes it
# (GitHub release immutability is the intended end state). The recovery path for
# a bad cut is a new patch version, never a retag.
#
# This workflow is dormant until a tag is pushed, so it stays green in the
# pre-code discovery phase by never running. `workflow_dispatch` re-runs it for
# an existing tag and MUST be dispatched AT that tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish — dispatch this workflow AT that tag"
        required: true
        type: string

# A release must never be cancelled part-way through publishing: a half-created
# release with some assets attached is worse than a queued second run. A second
# tag push QUEUES behind the first rather than replacing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # ── plan: every release fact, verified before anything is built ─────────────
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      is-prerelease: ${{ steps.tag.outputs.is_prerelease }}
      have-notes: ${{ steps.notes.outputs.have_notes }}
    steps:
      - id: tag
        name: Resolve and validate the release tag
        # The dispatch input reaches the shell via env, never `${{ }}`-inline,
        # and must match a full semver tag shape before it is used as a checkout
        # ref below.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
              echo "::error::dispatched at '${GITHUB_REF}', not at refs/tags/${tag}. Run: gh workflow run Release --ref ${tag} -f tag=${tag}" >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          # A tag carrying a pre-release suffix (v1.2.3-rc1) publishes as a
          # pre-release; a bare vX.Y.Z is an official release.
          case "$tag" in
            *-*) is_prerelease=true ;;
            *)   is_prerelease=false ;;
          esac
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

      # github.sha is the commit the event ref pointed at; the tag-mismatch
      # refusal above guarantees it IS the tag's commit on a dispatch too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify the tag matches the workspace version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f Cargo.toml ]; then
            echo "::error::no Cargo.toml at ${TAG} — nothing to release." >&2
            exit 1
          fi
          manifest="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match workspace version $manifest in Cargo.toml." >&2
            exit 1
          fi
          echo "workspace version $manifest matches $TAG"

      # Release notes come from the changelog when there is one; otherwise the
      # github-release job lets GitHub generate them from the commit range.
      - id: notes
        name: Extract the changelog section for this tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ] || ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "No changelog section for $VERSION — notes will be auto-generated."
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::the [$VERSION] changelog section is empty." >&2
            exit 1
          fi
          echo "have_notes=true" >> "$GITHUB_OUTPUT"

      - name: Upload the release notes
        if: steps.notes.outputs.have_notes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md

  # ── github-release: create the release as a DRAFT ───────────────────────────
  github-release:
    name: github release (draft)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download the release notes
        if: needs.plan.outputs.have-notes == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # Created as a DRAFT and finalized only after every asset is attached: the
      # binaries and their Sigstore bundles are produced by build-binaries,
      # which runs after this job, and publishing here would freeze the release
      # before those assets exist. A draft is still mutable — the window those
      # uploads need.
      - name: Create the GitHub release as a draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: ${{ needs.plan.outputs.tag }}
          # The title is the bare version; the repository already says whose
          # release it is.
          name: ${{ needs.plan.outputs.version }}
          body_path: ${{ needs.plan.outputs.have-notes == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ needs.plan.outputs.have-notes != 'true' }}
          # The quickstart compose file rides along as a release asset: it pulls
          # the image this tag publishes, so a downloader never clones the repo.
          files: compose.yaml
          prerelease: ${{ needs.plan.outputs.is-prerelease }}

  # ── build-binaries: the SLSA L3 lane, once per target ───────────────────────
  # This job is a CALL AND NOTHING ELSE, deliberately: SLSA Build L3 requires
  # the signing material to be out of reach of user-defined build steps, and a
  # job's steps all share one runner VM. A reusable-workflow call cannot carry
  # `steps:`, which makes that regression unrepresentable rather than merely
  # discouraged. Native Linux runner per arch (the server ships for Linux
  # containers and hosts only): no cross toolchain, no QEMU.
  build-binaries:
    name: binaries (${{ matrix.target }})
    needs: [plan, github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    # Declared on both sides: a reusable workflow receives the caller's token
    # permissions, and GitHub's L3 guide asks for the same set in both places.
    permissions:
      contents: write # attach the per-arch tarballs to the release
      id-token: write # Sigstore, for the provenance + SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ github.sha }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  # ── build-image: the container image from the attested musl binaries ────────
  # A call and nothing else, for the same L3 reason as build-binaries.
  build-image:
    name: image (linux/amd64, linux/arm64)
    needs: [plan, build-binaries]
    permissions:
      contents: read
      packages: write # push the image and its attestations to GHCR
      id-token: write # Sigstore
      attestations: write
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ github.sha }}

  # ── finalize-release: verify the asset set, then PUBLISH (freeze) ───────────
  finalize-release:
    name: github release (publish)
    needs: [plan, build-binaries, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Every expected asset is attached before the release is frozen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          missing=""
          # Every suffix release-build.yml uploads per target. `grep -Fxq` —
          # fixed string, whole line — so ".tar.gz" is not satisfied by
          # ".tar.gz.sigstore.json".
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            aarch64-unknown-linux-musl; do
            for suffix in \
              ".tar.gz" \
              ".tar.gz.sha256sum" \
              ".tar.gz.sigstore.json" \
              ".tar.gz.sbom.sigstore.json" \
              ".tar.gz.build-sbom.sigstore.json" \
              ".tar.gz.intoto.jsonl" \
              ".cdx.json"; do
              printf '%s\n' "$assets" \
                | grep -Fxq "ferroterm-${TAG}-${target}${suffix}" \
                || missing="$missing ferroterm-${TAG}-${target}${suffix}"
            done
            printf '%s\n' "$assets" \
              | grep -Fxq "ferroterm-build-${TAG}-${target}.cdx.json" \
              || missing="$missing ferroterm-build-${TAG}-${target}.cdx.json"
          done
          printf '%s\n' "$assets" | grep -Fxq "compose.yaml" || missing="$missing compose.yaml"
          [ -z "$missing" ] || {
            echo "::error::the draft is missing assets, so it will not be published:$missing"
            exit 1
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # ── crates: the crates.io publish, approval-gated, after the release exists ─
  # Runs in the `crates-io` environment (a required reviewer pauses it) with
  # Trusted Publishing (OIDC); the per-crate, resumable script is shared with
  # publish-crates.yml. Idempotent: a release whose crate line was published
  # already uploads nothing and stays green.
  crates:
    name: crates.io
    needs: [plan, finalize-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    concurrency:
      group: publish-crates
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchange (rust-lang/crates-io-auth-action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache in the lane that uploads to crates.io: a published version is
      # immutable, so it is built from this checkout and nothing else.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - id: auth
        name: Exchange the OIDC identity for a temporary crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/release/publish-crates.sh publish
      - name: Verify every crate resolves at the crate-line version
        if: always()
        run: bash scripts/release/publish-crates.sh verify
