# .github/dependabot.yml — automated dependency updates.
#
# Two ecosystems for now: the GitHub Actions the workflows in this directory
# pin, and Cargo. The Cargo entry is harmless before any code lands (there is
# no Cargo.toml to resolve yet) and activates by itself the moment the
# workspace exists — no workflow edit needed when it does. The docker entry
# bumps the digest-pinned base image of docker/Dockerfile.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    # A delay between a release being published and this bot proposing it, so a
    # compromised or yanked release has a window to be caught before it reaches
    # a pull request (the OWASP CI/CD Security Cheat Sheet's third-party-code
    # control). Shorter than cargo: an action runs in CI but does not ship in
    # the product, and every action here is digest-pinned, so a bump is a
    # reviewed change of digest.
    #
    # SECURITY updates are exempt by design — Dependabot applies no cooldown to
    # advisory-driven bumps, so an advisory still arrives immediately. That is
    # what makes a cooldown safe rather than a delay on getting fixes.
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      # ONE weekly PR for every minor/patch action bump (one codeql-action
      # release alone opens three PRs, one per sub-action). MAJORS stay
      # individual: a breaking action major is a real review, and burying one
      # in a batch is how it gets rubber-stamped.
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"          # plain conventional prefix; no attribution

  - package-ecosystem: "cargo"
    directory: "/"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    # Longer than actions: a compromised crate executes in the build AND ships
    # in the binary, which is the higher-consequence case. Security bumps are
    # exempt from the cooldown, as above.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      # ONE weekly PR for every minor/patch bump; lockstep families (serde,
      # axum/tower, ...) bump together inside it by construction. MAJORS stay
      # individual — a semver major in shipped code is a real review.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/docker"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    # The base image is pinned by index digest; a bump is a reviewed change of
    # digest, like an action. Security bumps are exempt from the cooldown.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build"
