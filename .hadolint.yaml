# hadolint configuration, read by the CI job (hadolint-action) and by a local
# `hadolint <Dockerfile>`. Every Dockerfile in the repository is held to the
# same bar: a digest-pinned FROM from a trusted registry, pinned packages, and
# no ignored rules without a recorded reason.
failure-threshold: warning
trustedRegistries:
  - docker.io
  - gcr.io
  - ghcr.io
