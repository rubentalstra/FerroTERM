# SPDX-License-Identifier: Apache-2.0

[book]
title = "FerroTERM"
authors = ["FerroTERM contributors"]
description = "Documentation for FerroTERM, a pure-Rust FHIR terminology server for SNOMED CT, LOINC, and other clinical code systems."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
# The book is served under /docs/ on the combined Pages site (the landing page
# sits at the root). site-url makes the book's absolute asset and search links
# resolve under that path.
site-url = "/docs/"
default-theme = "rust"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/rubentalstra/FerroTERM"
edit-url-template = "https://github.com/rubentalstra/FerroTERM/edit/main/website/book/src/{path}"
mathjax-support = true
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.search]
enable = true

# Mermaid diagrams render from ```mermaid fenced blocks. The additional-js above
# ships the vendored renderer, dropped by `mdbook-mermaid install website/book`.
[preprocessor.mermaid]
command = "mdbook-mermaid"

# Table of contents from a `<!-- toc -->` marker in long chapters.
[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]
