# SPDX-License-Identifier: MIT
[package]
name = "ferroterm-server"
description = "The FerroTERM FHIR terminology server for SNOMED CT, LOINC, and other clinical code systems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# A thin main.rs over a testable lib.rs (.claude/rules/testing.md).
[lib]
path = "src/lib.rs"

[[bin]]
name = "ferroterm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
http.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
