# The Trunk build for the viewer bundle. Reference:
# https://github.com/trunk-rs/trunk/blob/main/guide/src/configuration/index.md
trunk-version = ">=0.21.14"

[build]
target = "index.html"
dist = "dist"
# The server mounts the bundle at /ui, and Trunk rewrites every emitted href
# with this prefix.
public_url = "/ui/"
# Content-hashed asset names, so a long immutable Cache-Control on them is true.
filehash = true
# The build never re-resolves the workspace behind the lock file.
locked = true
minify = "on_release"

[serve]
port = 8081
# `trunk serve` proxies the FHIR roots to a locally running server, so the
# development bundle talks to the same origin it is served from.
[[proxy]]
backend = "http://127.0.0.1:8080/r4"
[[proxy]]
backend = "http://127.0.0.1:8080/r4b"
[[proxy]]
backend = "http://127.0.0.1:8080/r5"
[[proxy]]
backend = "http://127.0.0.1:8080/r6"
[[proxy]]
backend = "http://127.0.0.1:8080/health"

[tools]
# The official Tailwind standalone CLI, which Trunk downloads itself. There is
# no Node in this build.
tailwindcss = "4.3.3"
