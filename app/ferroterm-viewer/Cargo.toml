# SPDX-License-Identifier: BUSL-1.1
[package]
name = "ferroterm-viewer"
description = "The FerroTERM viewer: a client-side-rendered FHIR terminology browser served by the FerroTERM server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Never published: the viewer ships as a bundle the server serves.
publish = false

[[bin]]
name = "ferroterm-viewer"
path = "src/main.rs"

# The crate builds twice, into two bundles the server serves side by side.
# The reader bundle is the default feature set, served at /ui; the editor
# bundle is the same crate with `editor` on, served at /ui/editor, and it
# carries every reader screen plus the authoring screens. A reader who never
# signs in downloads no editor byte.
[features]
# The authoring screens, and the router base they are served under.
editor = []

# The evidence screen states figures the repository already commits, so the
# build script reads those files and emits the document the bundle carries.
# A build dependency runs on the host and never reaches the browser, so the
# FHIR-client boundary is untouched.
[build-dependencies]
serde_json.workspace = true

# The viewer is a FHIR client and depends on NO workspace crate, so that
# anything it can do a client can do. scripts/checks/viewer-boundary.sh fails
# when an edge into the engine appears.
[dependencies]
console_error_panic_hook.workspace = true
gloo-net.workspace = true
http.workspace = true
js-sys.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "Crypto",
  "Document",
  "DomTokenList",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "Location",
  "MediaQueryList",
  "Performance",
  "Storage",
  "SubtleCrypto",
  "Window",
] }

[lints]
workspace = true
