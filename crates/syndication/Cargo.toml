# SPDX-License-Identifier: BUSL-1.1
[package]
name = "syndication"
description = "Atom terminology syndication client: the feed model, entry selection, and checksum-verified download"
version = "0.1.100"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/syndication"
readme = "README.md"
keywords = ["atom", "syndication", "terminology", "snomed", "fhir"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io (.claude/rules/crates-publishing.md);
# `include` is the packaged content the bump rule watches.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
jiff.workspace = true
md-5.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "macros"] }
wiremock.workspace = true

[lints]
workspace = true
