# SPDX-License-Identifier: BUSL-1.1
[package]
name = "labcodeset"
description = "Nederlandse Labcodeset publication (labconcepts XML) reader"
version = "0.1.66"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/labcodeset"
readme = "README.md"
keywords = ["labcodeset", "loinc", "dutch", "healthcare", "terminology"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io (.claude/rules/crates-publishing.md);
# `include` is the packaged content the bump rule watches.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
quick-xml.workspace = true
thiserror.workspace = true

[dev-dependencies]
ferroterm-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
