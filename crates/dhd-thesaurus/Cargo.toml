publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
csv.workspace = true
classification.workspace = true
thiserror.workspace = true

[dev-dependencies]
ferroterm-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
