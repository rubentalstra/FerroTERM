[package]
name = "dhd-thesaurus"
description = "DHD Diagnosethesaurus and Verrichtingenthesaurus delivery (uitleverformaat 5.0) reader"
version = "0.1.55"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/dhd-thesaurus"
readme = "README.md"
keywords = ["dhd", "thesaurus", "dutch", "healthcare", "terminology"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io (.claude/rules/crates-publishing.md);
