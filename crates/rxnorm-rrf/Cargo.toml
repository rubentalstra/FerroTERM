# SPDX-License-Identifier: BUSL-1.1
[package]
name = "rxnorm-rrf"
description = "RxNorm Rich Release Format reader and typed row model"
version = "0.1.31"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/rxnorm-rrf"
readme = "README.md"
keywords = ["rxnorm", "rrf", "medication", "terminology", "healthcare"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io (.claude/rules/crates-publishing.md);
# `include` is the packaged content the bump rule watches.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
csv.workspace = true
thiserror.workspace = true

[dev-dependencies]
ferroterm-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
