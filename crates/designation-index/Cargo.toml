# SPDX-License-Identifier: BUSL-1.1
[package]
name = "designation-index"
description = "The fst and roaring description search index"
version = "0.1.48"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/designation-index"
readme = "README.md"
keywords = ["search", "fst", "terminology", "snomed", "index"]
categories = ["text-processing", "science"]
# The crate line is published on crates.io (.claude/rules/crates-publishing.md);
# `include` is the packaged content the bump rule watches.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
concept-graph.workspace = true
fst.workspace = true
roaring.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
rf2.workspace = true
proptest.workspace = true

[lints]
workspace = true
