# SPDX-License-Identifier: BUSL-1.1
[package]
name = "terminology-syndication"
description = "Atom terminology syndication client: the feed model, entry selection, and checksum-verified download"
version = "0.1.107"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["atom", "syndication", "terminology", "snomed", "fhir"]
categories = ["parser-implementations", "science"]
# NOTE: unpublished: the owner's decision of 2026-09-23 keeps the syndication
# client out of crates.io; it is consumed inside this workspace only
# (.claude/rules/crates-publishing.md). `include` still names the packaged
# content the lockstep bump rule watches.
publish = false
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
jiff.workspace = true
md-5.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "macros"] }
wiremock.workspace = true

[lints]
workspace = true
