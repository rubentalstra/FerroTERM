# SPDX-License-Identifier: Apache-2.0
[package]
name = "rf2"
description = "SNOMED CT RF2 loader and typed component model"
version = "0.1.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/rf2"
readme = "README.md"
keywords = ["snomed", "snomed-ct", "rf2", "terminology", "healthcare"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io (.claude/rules/crates-publishing.md);
# `include` is the packaged content the bump rule watches.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
csv.workspace = true
jiff.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
