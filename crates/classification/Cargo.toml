# SPDX-License-Identifier: Apache-2.0
[package]
name = "classification"
description = "ClaML and ICD-10-CM tabular readers into one classification model"
version = "0.1.20"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/classification"
readme = "README.md"
keywords = ["icd-10", "claml", "atc", "classification", "healthcare"]
categories = ["parser-implementations", "science"]
# The crate line is published on crates.io (.claude/rules/crates-publishing.md);
# `include` is the packaged content the bump rule watches.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
csv.workspace = true
quick-xml.workspace = true
thiserror.workspace = true

[dev-dependencies]
ferroterm-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
