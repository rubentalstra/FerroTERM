# SPDX-License-Identifier: BUSL-1.1
[package]
name = "concept-store"
description = "The memory-mapped columnar concept and description store"
version = "0.1.56"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/concept-store"
readme = "README.md"
keywords = ["terminology", "snomed", "redb", "healthcare", "mmap"]
categories = ["database-implementations", "science"]
# The crate line is published on crates.io (.claude/rules/crates-publishing.md);
# `include` is the packaged content the bump rule watches.
publish = true
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
concept-graph.workspace = true
redb.workspace = true
thiserror.workspace = true

[dev-dependencies]
rf2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
