# SPDX-License-Identifier: BUSL-1.1

# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# This is the ONLY advisory gate. `cargo deny check advisories` reads the same
# RustSec database `cargo audit` does and adds yanked/licenses/bans/sources, so
# there is no separate cargo-audit job.

[advisories]
version = 2
# Fail on any RustSec advisory. Add exceptions explicitly, dated, and each
# naming the event that deletes it (an ignore is a standing liability driven to
# zero, re-checked at every dependency-bump cycle, never a permanent waiver).
yanked = "deny"
ignore = [
  # Both arrived with the viewer's leptos tree, both are `unmaintained` rather
  # than a vulnerability, and both are compile-time only, so neither reaches
  # the server binary or the WebAssembly bundle. Driven to zero on #432; each
  # is deleted when the upstream release that drops it is picked up.
  # paste, reached through leptos/either_of/reactive_graph/tachys. Added 2026-09-06.
  { id = "RUSTSEC-2024-0436", reason = "deleted when a leptos release stops pulling paste (#432)" },
  # proc-macro-error2, reached through leptos_macro and the other proc-macro
  # crates in that tree. Added 2026-09-06.
  { id = "RUSTSEC-2026-0173", reason = "deleted when leptos_macro moves off proc-macro-error2 (#432)" },
]

[licenses]
version = 2
# Permissive licenses a BUSL-1.1 project can depend on (and that its Apache 2.0
# Change License admits). Copyleft
# is NOT allowed by default; a genuinely necessary weak-copyleft dependency gets a
# crate-scoped `exceptions` entry with its reason, never a blanket allow.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  # Community Data License Agreement, Permissive 2.0 (e.g. the Mozilla CA
  # bundle data via webpki-roots). Permissive.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The project's own crates are BUSL-1.1 (LICENSE); no dependency may be.
exceptions = [
  { allow = ["BUSL-1.1"], crate = "concept-graph" },
  { allow = ["BUSL-1.1"], crate = "concept-store" },
  { allow = ["BUSL-1.1"], crate = "designation-index" },
  { allow = ["BUSL-1.1"], crate = "sct-ecl" },
  { allow = ["BUSL-1.1"], crate = "loinc" },
  { allow = ["BUSL-1.1"], crate = "classification" },
  { allow = ["BUSL-1.1"], crate = "dhd-thesaurus" },
  { allow = ["BUSL-1.1"], crate = "gstandaard" },
  { allow = ["BUSL-1.1"], crate = "labcodeset" },
  { allow = ["BUSL-1.1"], crate = "icd11" },
  { allow = ["BUSL-1.1"], crate = "rxnorm-rrf" },
  { allow = ["BUSL-1.1"], crate = "fhir-terminology" },
  { allow = ["BUSL-1.1"], crate = "ferroterm-server" },
  { allow = ["BUSL-1.1"], crate = "ferroterm-viewer" },
  { allow = ["BUSL-1.1"], crate = "ferroterm-build" },
  { allow = ["BUSL-1.1"], crate = "ferroterm-bench" },
  { allow = ["BUSL-1.1"], crate = "ferroterm-testkit" },
  { allow = ["BUSL-1.1"], crate = "fhir-codegen" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path-only deps carry an implicit "*" version, which is fine and never
# reaches a registry. External wildcards stay denied.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every dependency resolves from crates.io. A git source needs a version that
# is not published and a reason recorded here.
allow-git = []
