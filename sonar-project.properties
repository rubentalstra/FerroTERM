# SPDX-License-Identifier: MIT
# SonarQube Cloud project configuration.
#
# Advisory analysis only — never a merge gate, and never outranks the specs, the
# project rules, or the local gates (.claude/rules/ai-code-review.md). Rust is
# analyzed first-party (SonarQube Cloud runs Clippy over the workspace); shell,
# YAML, and other languages are covered by the multi-language sweep.

sonar.projectKey=rubentalstra_notio
sonar.organization=rubentalstra

# Scope: analyze the tree, minus build output, vendored inputs, and the
# generated crate (its correctness is the generator's, not hand-review's).
sonar.sources=.
sonar.exclusions=**/target/**,tools/notio-fhir-codegen/vendor/**,crates/notio-fhir/**

# Rust coverage is imported from the instrumented nextest run (lcov), wired into
# the sonar workflow when the Cargo workspace exists.
sonar.rust.lcov.reportPaths=lcov.info

# sonar.projectVersion is appended by the workflow at scan time from the
# workspace version (never a second hand-maintained copy) once Cargo.toml exists.
